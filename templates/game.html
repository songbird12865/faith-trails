{% extends "base.html" %}
{% block title %}Adventure Map{% endblock %}
{% block content %}

<!-- This is the permanent shell used by the single-page game. -->
<div id="game-shell" class="game-shell">

  <!-- JavaScript switches between the trail map and the active quest. -->
  <section id="map-view" class="game-view"></section>
  <section id="quest-view" class="game-view" hidden></section>

  <!-- Short status messages appear here and are announced to screen readers. -->
  <div id="toast" class="game-toast" aria-live="polite"></div>
</div>
<!-- This overlay celebrates a completed quest and its earned badge. -->
<div id="badge-overlay" class="badge-overlay" aria-hidden="true">
  
  <!-- The canvas draws confetti behind the celebration card. -->
  <canvas id="confetti-canvas"></canvas>
  <div class="celebration-card">
    <div id="celebration-badge" class="celebration-badge">🏅</div>
    <h2>Trail Complete!</h2><p id="celebration-copy"></p>
    <button id="celebration-continue" class="primary-button">Return to the Trail</button>
  </div>
</div>
<!-- Convert Flask data to safe JSON so game.js can build the first screen. -->
<script id="game-bootstrap" type="application/json">{{ {'quests': quests, 'earned': earned, 'profile': {'id': profile['id'], 'name': profile['name'], 'current_difficulty': profile['current_difficulty']}, 'difficulties': difficulties, 'initialQuest': initial_quest}|tojson }}</script>
{% endblock %}
{# Load the game engine only on the adventure page. #}
{% block scripts %}<script src="{{ url_for('static',filename='js/game.js') }}"></script>{% endblock %}
