<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173c2a">
  <title>{% block title %}Faith Trails{% endblock %} · A Closer Walk for Kids</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{parchment:'#FBF3E3',trailgreen:'#2F5233',trailgreendark:'#1E3A22',trailgold:'#D9A73B',trailsky:'#3B7A9C',inkbrown:'#3A2E20'},fontFamily:{display:['Baloo 2','sans-serif'],body:['Nunito','sans-serif']}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="bg-parchment text-inkbrown font-body min-h-screen">
  <!-- Audio elements live in the base template so music can continue while the
       JavaScript game shell changes views without replacing the page. -->
  <audio id="gameplay-music" loop preload="auto"><source src="{{ url_for('static',filename='music/gameplay_theme.mp3') }}" type="audio/mpeg"></audio>
  <audio id="celebration-music" loop preload="auto"><source src="{{ url_for('static',filename='music/celebration_theme.mp3') }}" type="audio/mpeg"></audio>
  <!-- A deliberate user gesture is required to unlock audio on mobile browsers. -->
  <div id="audio-gate" class="audio-gate" role="dialog" aria-modal="true">
    <div class="audio-gate-shade" aria-hidden="true"></div>
    <div class="audio-gate-card"><div class="gate-compass">🧭</div><h1>Faith Trails</h1><p>A Closer Walk for Kids</p><button id="start-adventure">Start Adventure</button></div>
    <p class="music-credit">
      Music provided by FiftySounds ·
      <a href="https://www.fiftysounds.com/" target="_blank" rel="noopener noreferrer">www.fiftysounds.com</a>
    </p>
  </div>
  <!-- Persistent navigation shared by maps, quests, collections, and rewards. -->
  <header class="app-header">
    <a href="{{ url_for('home') }}" class="brand-button" data-game-home><span>🧭</span> Faith Trails</a>
    <div class="header-actions">
      {% if profile %}<span class="player-chip">Explorer: {{ profile['name'] }}</span>{% endif %}
      <button id="music-toggle" class="round-control" aria-label="Turn music off">♫</button>
      <a href="{{ url_for('badges') }}" class="round-control" data-game-screen="badges" aria-label="My badges">🏅</a>
      <a href="{{ url_for('hall_of_fame') }}" class="round-control" data-game-screen="hall" aria-label="Hall of Fame">🏆</a>
      {% if profile %}<a href="{{ url_for('logout') }}" class="round-control" aria-label="Switch player">↻</a>{% endif %}
    </div>
  </header>
  <main id="app-main">{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static',filename='js/audio-engine.js') }}?v=6"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
