{% extends "base.html" %}
{% block title %}{{ quest['title'] }}{% endblock %}

{% block content %}

<div class="flex items-center justify-between mb-6">
  <a href="{{ url_for('home') }}" class="inline-flex items-center gap-1 text-trailgreen font-700 hover:text-trailsky transition-colors">
    &larr; Back to Trail Map
  </a>
  <span class="text-xs uppercase tracking-wide font-800 text-trailgold border-2 border-trailgold/50 rounded-full px-3 py-1 capitalize">
    {{ difficulty }}
  </span>
</div>

<div id="quest-card" class="bg-white/70 border-4 border-trailgold/40 rounded-3xl shadow-lg p-6 sm:p-10 min-h-[420px] flex flex-col">

  <!-- Progress dots -->
  <div id="progress-dots" class="flex justify-center gap-2 mb-6"></div>

  <!-- Narration control: shown/hidden per scene by playNarrationFor() below -->
  <div id="narration-control" class="flex justify-center mb-4 hidden">
    <button id="narration-btn" type="button"
      class="inline-flex items-center gap-2 bg-trailsky/10 hover:bg-trailsky/20 text-trailsky font-display font-700 text-sm px-4 py-2 rounded-full border-2 border-trailsky/40 transition-colors">
      <span id="narration-btn-icon" aria-hidden="true">🔊</span>
      <span id="narration-btn-label">Read to me</span>
    </button>
  </div>
  <audio id="narration-audio" preload="none"></audio>

  <div id="scene-container" class="flex-1 flex flex-col items-center justify-center text-center"></div>

  <div id="scene-controls" class="mt-8 flex justify-center"></div>

</div>

<div id="badge-overlay" class="badge-overlay">
  <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

  <div class="badge-card">
    <div id="badge-circle" class="badge-circle">
      <span id="badge-circle-emoji" class="text-6xl" aria-hidden="true"></span>
    </div>

    <h2 id="badge-title" class="badge-title">Congratulations!</h2>
    <p id="badge-subtext" class="badge-subtext"></p>

    <button id="badge-continue-btn" class="badge-continue-btn" type="button">
      Continue
    </button>
  </div>

  <audio id="badge-sound" preload="auto">
    <source src="{{ url_for('static', filename='sounds/badge_earned.mp3') }}" type="audio/mpeg">
  </audio>
  <audio id="celebration-music" loop muted preload="auto">
    <source src="{{ url_for('static', filename='music/celebration_theme.mp3') }}" type="audio/mpeg">
  </audio>
</div>

<link rel="stylesheet" href="{{ url_for('static', filename='css/badge_celebration.css') }}">

<script>
  const scenes = {{ scenes_json | safe }};
  const questLesson = {{ lesson | tojson }};
  const questSlug = {{ quest['slug'] | tojson }};
  const questIcon = {{ quest['icon'] | tojson }};
  const questTitle = {{ quest['title'] | tojson }};
  const questDifficulty = {{ difficulty | tojson }};
  const lessonNarrationFile = {{ lesson_narration_file | tojson }};

  let current = 0;
  let placedCount = 0;

  const sceneContainer = document.getElementById('scene-container');
  const sceneControls = document.getElementById('scene-controls');
  const progressDots = document.getElementById('progress-dots');

  // ---- Narration -----------------------------------------------------
  // Every scene coming from the server already has a "narration_file"
  // field baked in (see narration_utils.py), pointing to the matching
  // pre-generated ElevenLabs .mp3 in static/audio/quests/. This section
  // just plays whichever one belongs to the scene currently on screen.

  const narrationControl = document.getElementById('narration-control');
  const narrationBtn = document.getElementById('narration-btn');
  const narrationLabel = document.getElementById('narration-btn-label');
  const narrationAudio = document.getElementById('narration-audio');
  let narrationPlaying = false;

  function resetNarrationButton() {
    narrationPlaying = false;
    narrationLabel.textContent = 'Read to me';
  }

  function stopNarration() {
    narrationAudio.pause();
    narrationAudio.currentTime = 0;
    resetNarrationButton();
    if (window.FaithTrailsAudio) {
      window.FaithTrailsAudio.unduck();
    }
  }

  function showNarrationFor(filename) {
    stopNarration();
    if (!filename) {
      narrationControl.classList.add('hidden');
      return;
    }
    narrationAudio.src = `/static/audio/quests/${filename}`;
    narrationControl.classList.remove('hidden');

    // Autoplay as soon as the scene appears. This works reliably here
    // because the child already tapped their name on the player picker
    // screen (a real user gesture), which is what unlocks audio autoplay
    // for the rest of the browser tab's session.
    narrationAudio.volume = 1.0;
    if (window.FaithTrailsAudio) {
      window.FaithTrailsAudio.duck();
    }
    narrationAudio.play()
      .then(() => {
        narrationPlaying = true;
        narrationLabel.textContent = 'Stop';
      })
      .catch(() => {
        // If the browser blocks it anyway, the button is still right
        // there for the child (or a parent) to tap manually.
        resetNarrationButton();
      });
  }

  narrationBtn.addEventListener('click', () => {
    if (narrationPlaying) {
      stopNarration();
      return;
    }
    narrationAudio.volume = 1.0;
    if (window.FaithTrailsAudio) {
      window.FaithTrailsAudio.duck();
    }
    narrationAudio.play().catch(() => {});
    narrationPlaying = true;
    narrationLabel.textContent = 'Stop';
  });

  narrationAudio.addEventListener('ended', () => {
    resetNarrationButton();
    if (window.FaithTrailsAudio) {
      window.FaithTrailsAudio.unduck();
    }
  });

  function renderDots() {
    progressDots.innerHTML = '';
    const total = scenes.length + 1; // +1 for the final badge scene
    for (let i = 0; i < total; i++) {
      const dot = document.createElement('span');
      dot.className = 'w-2.5 h-2.5 rounded-full ' +
        (i <= current ? 'bg-trailgreen' : 'bg-trailgreen/25');
      progressDots.appendChild(dot);
    }
  }

  function renderScene() {
    renderDots();
    sceneControls.innerHTML = '';

    if (current >= scenes.length) {
      renderBadgeScene();
      return;
    }

    const scene = scenes[current];

    if (scene.type === 'story') {
      showNarrationFor(scene.narration_file);
      sceneContainer.innerHTML = `
        <div class="text-6xl sm:text-7xl mb-6" aria-hidden="true">${scene.emoji}</div>
        <p class="font-body text-lg sm:text-xl leading-relaxed max-w-md">${scene.text}</p>
      `;
      const nextBtn = document.createElement('button');
      nextBtn.className = 'bg-trailgreen hover:bg-trailgreendark text-parchment font-display font-700 text-lg px-8 py-3 rounded-full shadow transition-colors';
      nextBtn.textContent = 'Next →';
      nextBtn.onclick = () => { current++; renderScene(); };
      sceneControls.appendChild(nextBtn);

    } else if (scene.type === 'interactive' && scene.subtype === 'matching') {
      showNarrationFor(scene.narration_file);
      renderMatchingScene(scene);

    } else if (scene.type === 'interactive' && scene.subtype === 'color_picker') {
      showNarrationFor(scene.narration_file);
      renderColorPickerScene(scene);

    } else if (scene.type === 'interactive' && scene.subtype === 'sequence') {
      showNarrationFor(scene.narration_file);
      renderSequenceScene(scene);

    } else if (scene.type === 'quiz') {
      showNarrationFor(scene.narration_file);
      renderQuizScene(scene);

    } else if (scene.type === 'memory_verse') {
      // Memory verse narration is shown inside showLearn() below, since
      // that's the step where the verse text is actually on screen --
      // the later build/reference steps are hands-on activities.
      renderMemoryVerseScene(scene);
    }
  }

  function renderMatchingScene(scene) {
    placedCount = 0;

    sceneContainer.innerHTML = `
      <p class="font-display text-xl font-700 text-trailgreendark mb-6">${scene.prompt}</p>
      <div id="drop-zone" class="w-full max-w-sm mx-auto bg-trailsky/10 border-4 border-dashed border-trailsky/50 rounded-2xl p-4 mb-6 flex flex-wrap gap-2 justify-center min-h-[90px]">
        <span id="drop-zone-hint" class="text-trailsky/70 font-600 self-center">Drop or tap animals here &rarr;</span>
      </div>
      <div id="item-tray" class="flex flex-wrap gap-4 justify-center"></div>
    `;

    const tray = document.getElementById('item-tray');
    const dropZone = document.getElementById('drop-zone');

    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain');
      placeItem(id);
    });

    scene.items.forEach(item => {
      const el = document.createElement('button');
      el.id = 'item-' + item.id;
      el.draggable = true;
      el.className = 'bg-white border-2 border-trailgold rounded-xl px-3 py-2 flex flex-col items-center shadow hover:scale-105 transition-transform cursor-grab active:cursor-grabbing';
      el.innerHTML = `<span class="text-3xl" aria-hidden="true">${item.emoji}</span><span class="text-xs font-700 mt-1">${item.label}</span>`;

      // Drag support (desktop)
      el.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', item.id);
      });

      // Tap-to-place support (touch devices / accessibility)
      el.addEventListener('click', () => placeItem(item.id));

      tray.appendChild(el);
    });

    // No "Next" button here — it appears automatically once every item is placed.
  }

  function placeItem(id) {
    const el = document.getElementById('item-' + id);
    if (!el || el.dataset.placed === 'true') return;

    el.dataset.placed = 'true';
    el.disabled = true;
    el.classList.add('opacity-40', 'pointer-events-none');

    const hint = document.getElementById('drop-zone-hint');
    if (hint) hint.remove();

    const dropZone = document.getElementById('drop-zone');
    const placedIcon = document.createElement('span');
    placedIcon.className = 'text-3xl';
    placedIcon.textContent = el.querySelector('span').textContent;
    dropZone.appendChild(placedIcon);

    placedCount++;

    const scene = scenes[current];
    if (placedCount >= scene.items.length) {
      const nextBtn = document.createElement('button');
      nextBtn.className = 'bg-trailgreen hover:bg-trailgreendark text-parchment font-display font-700 text-lg px-8 py-3 rounded-full shadow transition-colors mt-2';
      nextBtn.textContent = 'Next →';
      nextBtn.onclick = () => { current++; renderScene(); };
      sceneControls.innerHTML = '';
      sceneControls.appendChild(nextBtn);
    }
  }

  function renderColorPickerScene(scene) {
    const stripeColors = new Array(scene.target_count).fill(null);

    function draw() {
      const stripesHtml = stripeColors
        .map(c => `<div class="coat-stripe" style="background:${c || '#EFE6D0'}"></div>`)
        .join('');

      sceneContainer.innerHTML = `
        <p class="font-display text-xl font-700 text-trailgreendark mb-4 max-w-md">${scene.prompt}</p>
        <div id="coat-preview" class="flex flex-col w-40 mx-auto mb-6 rounded-lg overflow-hidden border-4 border-trailgold shadow">${stripesHtml}</div>
        <div id="color-palette" class="flex flex-wrap gap-3 justify-center max-w-md mx-auto"></div>
      `;
      sceneControls.innerHTML = '';

      const palette = document.getElementById('color-palette');
      scene.palette.forEach(color => {
        const btn = document.createElement('button');
        btn.className = 'w-10 h-10 rounded-full border-2 border-white shadow hover:scale-110 transition-transform';
        btn.style.background = color.hex;
        btn.setAttribute('aria-label', color.name);
        btn.title = color.name;
        btn.onclick = () => {
          const nextEmpty = stripeColors.findIndex(c => c === null);
          if (nextEmpty === -1) return;
          stripeColors[nextEmpty] = color.hex;
          draw();
          if (stripeColors.every(c => c !== null)) {
            const nextBtn = document.createElement('button');
            nextBtn.className = 'bg-trailgreen hover:bg-trailgreendark text-parchment font-display font-700 text-lg px-8 py-3 rounded-full shadow transition-colors mt-2';
            nextBtn.textContent = 'Next \u2192';
            nextBtn.onclick = () => { current++; renderScene(); };
            sceneControls.appendChild(nextBtn);
          }
        };
        palette.appendChild(btn);
      });
    }

    draw();
  }

  function renderSequenceScene(scene) {
    // Correct order is simply the order the items appear in scene.items.
    // The tray starts shuffled; the child taps items to add them, in
    // order, to the assembly line, then we check the final order.
    let tray = [];
    let assembled = [];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function start() {
      tray = shuffle(scene.items);
      assembled = [];
      draw();
    }

    function draw() {
      sceneContainer.innerHTML = `
        <p class="font-display text-xl font-700 text-trailgreendark mb-2">${scene.prompt}</p>
        <p class="text-sm text-inkbrown/60 mb-4">Tap an event you've already placed to move it back.</p>
        <div id="sequence-line" class="min-h-[64px] w-full max-w-lg mx-auto bg-trailsky/10 border-4 border-dashed border-trailsky/40 rounded-2xl p-3 mb-6 flex flex-wrap gap-2 justify-center items-center"></div>
        <div id="sequence-tray" class="flex flex-wrap gap-3 justify-center max-w-lg mx-auto"></div>
        <p id="sequence-feedback" class="mt-4 font-700 min-h-[1.5rem]"></p>
      `;
      sceneControls.innerHTML = '';

      const sequenceLine = document.getElementById('sequence-line');
      const sequenceTray = document.getElementById('sequence-tray');

      assembled.forEach((item, idx) => {
        const chip = document.createElement('button');
        chip.className = 'bg-trailgreen text-parchment font-700 px-3 py-1.5 rounded-lg hover:bg-trailgreendark transition-colors flex items-center gap-1';
        chip.innerHTML = `<span class="text-xs opacity-75">${idx + 1}.</span> <span aria-hidden="true">${item.emoji}</span> ${item.label}`;
        chip.title = 'Tap to move back';
        chip.onclick = () => {
          assembled = assembled.filter(i => i.id !== item.id);
          tray.push(item);
          document.getElementById('sequence-feedback').textContent = '';
          draw();
        };
        sequenceLine.appendChild(chip);
      });

      tray.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'bg-white border-2 border-trailgold rounded-xl px-3 py-2 flex flex-col items-center shadow hover:scale-105 transition-transform';
        btn.innerHTML = `<span class="text-2xl" aria-hidden="true">${item.emoji}</span><span class="text-xs font-700 mt-1 max-w-[6rem]">${item.label}</span>`;
        btn.onclick = () => {
          assembled.push(item);
          tray = tray.filter(i => i.id !== item.id);
          draw();
          if (tray.length === 0) {
            checkOrder();
          }
        };
        sequenceTray.appendChild(btn);
      });
    }

    function checkOrder() {
      const feedback = document.getElementById('sequence-feedback');
      const correct = assembled.every((item, idx) => item.id === scene.items[idx].id);
      if (correct) {
        feedback.textContent = 'You got it! \ud83c\udf89';
        feedback.className = 'mt-4 font-700 min-h-[1.5rem] text-trailgreen';
        const nextBtn = document.createElement('button');
        nextBtn.className = 'bg-trailgreen hover:bg-trailgreendark text-parchment font-display font-700 text-lg px-8 py-3 rounded-full shadow transition-colors mt-2';
        nextBtn.textContent = 'Next \u2192';
        nextBtn.onclick = () => { current++; renderScene(); };
        sceneControls.innerHTML = '';
        sceneControls.appendChild(nextBtn);
      } else {
        feedback.textContent = 'Not quite \u2014 fix the order above, or start over!';
        feedback.className = 'mt-4 font-700 min-h-[1.5rem] text-trailgold';
        const retryBtn = document.createElement('button');
        retryBtn.className = 'bg-trailgold hover:bg-trailgold/80 text-inkbrown font-display font-700 px-6 py-2 rounded-full shadow mt-2';
        retryBtn.textContent = 'Start Over';
        retryBtn.onclick = start;
        sceneControls.innerHTML = '';
        sceneControls.appendChild(retryBtn);
      }
    }

    start();
  }

  function renderQuizScene(scene) {
    sceneContainer.innerHTML = `
      <div class="text-5xl mb-4" aria-hidden="true">🤔</div>
      <p class="font-display text-xl font-700 text-trailgreendark mb-6 max-w-md">${scene.prompt}</p>
      <div id="quiz-options" class="flex flex-col gap-3 max-w-md mx-auto w-full"></div>
      <p id="quiz-feedback" class="mt-4 font-700 min-h-[1.5rem]"></p>
    `;
    sceneControls.innerHTML = '';

    const optionsContainer = document.getElementById('quiz-options');
    scene.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'bg-white border-2 border-trailgold rounded-xl px-4 py-3 font-700 text-left shadow hover:bg-trailgold/10 transition-colors';
      btn.textContent = opt;
      btn.onclick = () => {
        const feedback = document.getElementById('quiz-feedback');
        if (idx === scene.correct_index) {
          feedback.textContent = 'That\u2019s right! \ud83c\udf89';
          feedback.className = 'mt-4 font-700 min-h-[1.5rem] text-trailgreen';
          btn.classList.add('border-trailgreen', 'bg-trailgreen/10');
          setTimeout(() => { current++; renderScene(); }, 700);
        } else {
          feedback.textContent = 'Not quite \u2014 try again!';
          feedback.className = 'mt-4 font-700 min-h-[1.5rem] text-trailgold';
        }
      };
      optionsContainer.appendChild(btn);
    });
  }

  function renderMemoryVerseScene(scene) {
    let step = 'learn'; // 'learn' -> 'build' -> 'reference'
    let tray = [];
    let assembled = [];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function showLearn() {
      showNarrationFor(scene.narration_file);
      sceneContainer.innerHTML = `
        <div class="text-5xl mb-4" aria-hidden="true">📖</div>
        <p class="font-display text-2xl font-800 text-trailgreendark mb-4">Let's learn a memory verse!</p>
        <blockquote class="font-body text-xl italic max-w-md mb-2">&ldquo;${scene.verse}&rdquo;</blockquote>
        <p class="font-display font-700 text-trailsky mb-4">${scene.reference}</p>
        <p class="text-sm text-inkbrown/60 max-w-sm">Read it a few times. When you're ready, let's put it back together!</p>
      `;
      sceneControls.innerHTML = '';
      const btn = document.createElement('button');
      btn.className = 'bg-trailgreen hover:bg-trailgreendark text-parchment font-display font-700 text-lg px-8 py-3 rounded-full shadow transition-colors';
      btn.textContent = "I'm ready \u2192";
      btn.onclick = () => { step = 'build'; startBuild(); };
      sceneControls.appendChild(btn);
    }

    function startBuild() {
      // Each word gets a unique id (not just its text) so verses with
      // repeated words (like "the" or "and") can be moved individually
      // without ambiguity.
      tray = shuffle(scene.verse.split(' ').map((word, id) => ({ id, word })));
      assembled = [];
      drawBuild();
    }

    function drawBuild() {
      showNarrationFor(null);
      sceneContainer.innerHTML = `
        <p class="font-display text-xl font-700 text-trailgreendark mb-2">Tap the words in the right order!</p>
        <p class="text-sm text-inkbrown/60 mb-4">Tap a word you've already placed to move it back.</p>
        <div id="assembly-line" class="min-h-[64px] w-full max-w-lg mx-auto bg-trailsky/10 border-4 border-dashed border-trailsky/40 rounded-2xl p-3 mb-6 flex flex-wrap gap-2 justify-center items-center"></div>
        <div id="word-tray" class="flex flex-wrap gap-2 justify-center max-w-lg mx-auto"></div>
        <p id="build-feedback" class="mt-4 font-700 min-h-[1.5rem]"></p>
      `;
      sceneControls.innerHTML = '';

      const assemblyLine = document.getElementById('assembly-line');
      const wordTray = document.getElementById('word-tray');

      assembled.forEach(item => {
        const chip = document.createElement('button');
        chip.className = 'bg-trailgreen text-parchment font-700 px-3 py-1.5 rounded-lg hover:bg-trailgreendark transition-colors';
        chip.textContent = item.word;
        chip.title = 'Tap to move back';
        chip.onclick = () => {
          assembled = assembled.filter(w => w.id !== item.id);
          tray.push(item);
          document.getElementById('build-feedback').textContent = '';
          drawBuild();
        };
        assemblyLine.appendChild(chip);
      });

      tray.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'bg-white border-2 border-trailgold rounded-lg px-3 py-1.5 font-700 shadow hover:scale-105 transition-transform';
        btn.textContent = item.word;
        btn.onclick = () => {
          assembled.push(item);
          tray = tray.filter(w => w.id !== item.id);
          drawBuild();
          if (tray.length === 0) {
            checkAssembled();
          }
        };
        wordTray.appendChild(btn);
      });
    }

    function checkAssembled() {
      const feedback = document.getElementById('build-feedback');
      const correct = assembled.map(item => item.word).join(' ') === scene.verse;
      if (correct) {
        feedback.textContent = 'You got it! \ud83c\udf89';
        feedback.className = 'mt-4 font-700 min-h-[1.5rem] text-trailgreen';
        setTimeout(() => { step = 'reference'; showReference(); }, 900);
      } else {
        feedback.textContent = "Not quite \u2014 fix a word above, or start over!";
        feedback.className = 'mt-4 font-700 min-h-[1.5rem] text-trailgold';
        const retryBtn = document.createElement('button');
        retryBtn.className = 'bg-trailgold hover:bg-trailgold/80 text-inkbrown font-display font-700 px-6 py-2 rounded-full shadow mt-2';
        retryBtn.textContent = 'Start Over';
        retryBtn.onclick = startBuild;
        sceneControls.appendChild(retryBtn);
      }
    }


    function showReference() {
      sceneContainer.innerHTML = `
        <div class="text-5xl mb-4" aria-hidden="true">📍</div>
        <p class="font-display text-xl font-700 text-trailgreendark mb-2">Great job! Now &mdash; where is this verse found?</p>
        <blockquote class="font-body italic mb-6 max-w-md">&ldquo;${scene.verse}&rdquo;</blockquote>
        <div id="reference-options" class="flex flex-col gap-3 max-w-xs mx-auto w-full"></div>
        <p id="reference-feedback" class="mt-4 font-700 min-h-[1.5rem]"></p>
      `;
      sceneControls.innerHTML = '';

      const optionsContainer = document.getElementById('reference-options');
      shuffle(scene.reference_options).forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'bg-white border-2 border-trailgold rounded-xl px-4 py-3 font-700 shadow hover:bg-trailgold/10 transition-colors';
        btn.textContent = opt;
        btn.onclick = () => {
          const feedback = document.getElementById('reference-feedback');
          if (opt === scene.reference) {
            feedback.textContent = 'That\u2019s right! \ud83c\udf89';
            feedback.className = 'mt-4 font-700 min-h-[1.5rem] text-trailgreen';
            btn.classList.add('border-trailgreen', 'bg-trailgreen/10');
            setTimeout(() => { current++; renderScene(); }, 800);
          } else {
            feedback.textContent = 'Not quite \u2014 try another one!';
            feedback.className = 'mt-4 font-700 min-h-[1.5rem] text-trailgold';
          }
        };
        optionsContainer.appendChild(btn);
      });
    }

    showLearn();
  }

  // ---- Badge celebration ------------------------------------------
  const badgeOverlay = document.getElementById('badge-overlay');
  const confettiCanvas = document.getElementById('confetti-canvas');
  const confettiCtx = confettiCanvas.getContext('2d');
  const badgeCircle = document.getElementById('badge-circle');
  const badgeCircleEmoji = document.getElementById('badge-circle-emoji');
  const badgeTitle = document.getElementById('badge-title');
  const badgeSubtext = document.getElementById('badge-subtext');
  const badgeContinueBtn = document.getElementById('badge-continue-btn');
  const badgeSound = document.getElementById('badge-sound');
  const celebrationMusic = document.getElementById('celebration-music');

  let confettiParticles = [];
  let confettiRunning = false;
  let confettiRafId = null;

  function resizeConfettiCanvas() {
    confettiCanvas.width = badgeOverlay.clientWidth;
    confettiCanvas.height = badgeOverlay.clientHeight;
  }

  function makeConfettiParticle() {
    const colors = ['#EF9F27', '#1D9E75', '#D85A30', '#7F77DD', '#378ADD'];
    return {
      x: Math.random() * confettiCanvas.width,
      y: -20 - Math.random() * confettiCanvas.height,
      size: 5 + Math.random() * 5,
      speed: 1.5 + Math.random() * 2.5,
      drift: (Math.random() - 0.5) * 1.5,
      rotation: Math.random() * 360,
      spin: (Math.random() - 0.5) * 8,
      color: colors[Math.floor(Math.random() * colors.length)]
    };
  }

  function initConfetti() {
    confettiParticles = [];
    for (let i = 0; i < 70; i++) {
      const p = makeConfettiParticle();
      p.y = Math.random() * confettiCanvas.height;
      confettiParticles.push(p);
    }
  }

  function animateConfetti() {
    if (!confettiRunning) return;
    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    for (const p of confettiParticles) {
      p.y += p.speed;
      p.x += p.drift;
      p.rotation += p.spin;
      if (p.y > confettiCanvas.height + 20) {
        Object.assign(p, makeConfettiParticle());
        p.y = -20;
      }
      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate((p.rotation * Math.PI) / 180);
      confettiCtx.fillStyle = p.color;
      confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      confettiCtx.restore();
    }
    confettiRafId = requestAnimationFrame(animateConfetti);
  }

  function openBadgeCelebration() {
    badgeCircle.className = 'badge-circle badge-circle--' + questDifficulty;
    badgeCircleEmoji.textContent = questIcon;
    badgeSubtext.textContent =
      'You have earned the ' + questDifficulty + ' ' + questTitle + ' badge! ' + questLesson;

    badgeOverlay.classList.add('is-open');
    resizeConfettiCanvas();
    initConfetti();
    confettiRunning = true;
    animateConfetti();

    badgeSound.currentTime = 0;
    badgeSound.play().catch(() => {});

    if (window.FaithTrailsAudio) {
      window.FaithTrailsAudio.switchToCelebration();
    } else {
      celebrationMusic.volume = 0.5;
      celebrationMusic.currentTime = 0;
      celebrationMusic.play().catch(() => {});
    }

    requestAnimationFrame(() => {
      badgeCircle.style.transition = 'transform 0.6s cubic-bezier(0.34,1.56,0.64,1)';
      badgeCircle.style.transform = 'scale(1)';
    });
    setTimeout(() => { badgeTitle.style.opacity = '1'; }, 300);
    setTimeout(() => { badgeSubtext.style.opacity = '1'; }, 500);
    setTimeout(() => { badgeContinueBtn.style.opacity = '1'; }, 700);
  }

  function closeBadgeCelebration() {
    confettiRunning = false;
    if (confettiRafId) cancelAnimationFrame(confettiRafId);
    badgeOverlay.classList.remove('is-open');

    if (window.FaithTrailsAudio) {
      window.FaithTrailsAudio.switchToGameplay();
    } else {
      celebrationMusic.pause();
    }

    window.location.href = "{{ url_for('home') }}";
  }

  badgeContinueBtn.addEventListener('click', closeBadgeCelebration);
  window.addEventListener('resize', () => {
    if (confettiRunning) resizeConfettiCanvas();
  });

  function renderBadgeScene() {
    showNarrationFor(lessonNarrationFile);
    sceneContainer.innerHTML = '';
    sceneControls.innerHTML = '';

    // Save the badge to the database, then celebrate regardless of
    // whether the save request succeeds (non-fatal for the MVP -- the
    // child still sees their celebration even if offline).
    fetch(`/api/complete/${questSlug}`, { method: 'POST' })
      .catch(() => {})
      .finally(() => {
        openBadgeCelebration();
      });
  }

  renderScene();
</script>
