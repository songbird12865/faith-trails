{% extends "base.html" %}
{% block title %}{{ quest['title'] }}{% endblock %}

{% block content %}
<a href="{{ url_for('home') }}" class="inline-flex items-center gap-1 text-trailgreen font-700 mb-6 hover:text-trailsky transition-colors">
  &larr; Back to Trail Map
</a>

<div class="bg-white/70 border-4 border-trailgold/40 rounded-3xl shadow-lg p-10 text-center">
  <div class="text-6xl mb-4" aria-hidden="true">{{ quest['icon'] }}</div>
  <h1 class="font-display text-2xl font-800 text-trailgreendark mb-2">{{ quest['title'] }}</h1>
  <p class="font-body text-lg text-inkbrown/70 mb-1">This trail stop is still being built.</p>
  <p class="font-display text-sm uppercase tracking-wide text-trailgold font-800">Coming soon</p>
</div>
{% endblock %}
